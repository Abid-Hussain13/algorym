[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter client... run build"
  publish = "apps/client/dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# The SPA rewrite serves index.html at "/", so it needs its own no-cache rule
# or browsers keep serving an old bundle after a deploy.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
