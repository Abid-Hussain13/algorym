$kind: http-request
name: Demo Data
method: GET
url: '{{baseUrl}}/api/demo/data'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('Response body text is "this is u data"', function () {
        pm.expect(pm.response.text()).to.equal('this is u data');
      });
