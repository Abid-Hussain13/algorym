$kind: http-request
name: Get Me
method: GET
url: '{{baseUrl}}/api/auth/getme'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('Response has success: true', function () {
        const json = pm.response.json();
        pm.expect(json.success).to.be.true;
      });

      pm.test('Response body has user object with id and email', function () {
        const json = pm.response.json();
        pm.expect(json.user).to.be.an('object');
        pm.expect(json.user).to.have.property('id');
        pm.expect(json.user).to.have.property('email');
      });

      pm.test('Returned user id matches saved userId', function () {
        const json = pm.response.json();
        pm.expect(String(json.user.id)).to.equal(String(pm.environment.get('userId')));
      });
