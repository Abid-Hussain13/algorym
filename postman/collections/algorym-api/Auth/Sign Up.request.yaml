$kind: http-request
name: Sign Up
method: POST
url: '{{baseUrl}}/api/auth/signup'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "{{userName}}",
      "email": "{{userEmail}}",
      "password": "{{userPassword}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const timestamp = Date.now();
      pm.environment.set('userEmail', `testuser_${timestamp}@example.com`);
      pm.environment.set('userName', 'Test User');
      pm.environment.set('userPassword', 'Test@1234');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 201', function () {
        pm.response.to.have.status(201);
      });

      pm.test('Response has success: true', function () {
        const json = pm.response.json();
        pm.expect(json.success).to.be.true;
      });

      pm.test('Response body has user object with id, name, email', function () {
        const json = pm.response.json();
        pm.expect(json.user).to.be.an('object');
        pm.expect(json.user).to.have.property('id');
        pm.expect(json.user).to.have.property('name');
        pm.expect(json.user).to.have.property('email');
      });

      pm.test('Save userId to environment', function () {
        const json = pm.response.json();
        pm.environment.set('userId', json.user.id);
      });

      pm.test('Cookie accessToken is set', function () {
        pm.expect(pm.cookies.has('accessToken')).to.be.true;
      });

      pm.test('Cookie refreshToken is set', function () {
        pm.expect(pm.cookies.has('refreshToken')).to.be.true;
      });
